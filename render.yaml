# Optional free web hosting. Accounts are paused; no database is provisioned.
services:
  - type: web
    name: living-world
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ENABLE_ACCOUNTS
        value: "false"
      - key: VITE_ENABLE_ACCOUNTS
        value: "false"
